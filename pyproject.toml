[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt"
version = "0.1.0"
description = "Intelligent personal finance analysis engine — ingests bank transaction data, clusters it semantically, tracks behavioral drift, and generates plain-English narratives via the Anthropic API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Alkindi", email = "alkndymhmd692@gmail.com" }]
requires-python = ">=3.11"
keywords = ["finance", "transactions", "analysis", "anthropic", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "anthropic>=0.25.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "hdbscan>=0.8.33",
    "sqlalchemy>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.25.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "anyio>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/alkindymhmd/receipt"
Repository = "https://github.com/alkindymhmd/receipt"

[project.scripts]
receipt = "receipt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["receipt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"tests/*" = ["F811"]  # allow fixture redefinition

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
